<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>치지직 채팅 뷰어</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <section id="setup" class="setup">
      <div class="logo">💬</div>
      <h1>채팅만 보기</h1>
      <p>치지직 방송 화면 없이 실시간 채팅만 크게 볼 수 있습니다.</p>

      <form id="form">
        <input id="url" autocomplete="off"
          placeholder="치지직 방송 URL을 붙여넣으세요"
          inputmode="url">
        <button>채팅 열기</button>
      </form>

      <div id="error" class="error"></div>
      <div class="hint">예: https://chzzk.naver.com/live/채널ID</div>
    </section>

    <section id="viewer" class="viewer hidden">
      <header class="topbar">
        <div class="channel">
          <img id="channelImg" alt="">
          <div>
            <strong id="channelName">채널</strong>
            <span id="status">연결 중…</span>
          </div>
        </div>
        <div class="actions">
          <button id="fontMinus" aria-label="글자 작게">A−</button>
          <button id="fontPlus" aria-label="글자 크게">A+</button>
          <button id="settings" aria-label="설정">⚙</button>
        </div>
      </header>

      <div id="chat" class="chat" aria-live="polite"></div>

      <div id="settingsPanel" class="settings-panel hidden">
        <label>
          <span>자동 스크롤</span>
          <input id="autoScroll" type="checkbox" checked>
        </label>
        <label>
          <span>닉네임 표시</span>
          <input id="showName" type="checkbox" checked>
        </label>
        <label>
          <span>최대 채팅 수</span>
          <select id="maxMessages">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="500">500</option>
          </select>
        </label>
        <button id="back">다른 방송 열기</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
